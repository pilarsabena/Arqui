</defs><rect class="bg" width="1200" height="980"/><text class="h1" x="24" y="40">03 · Registros de segmentación</text><text class="h2" x="24" y="64">Qué guarda cada registro entre etapas (los &quot;latches&quot; del enunciado)</text><rect class="sIF" x="24" y="96" width="272" height="38" rx="10"/><text class="t" x="160.0" y="121" text-anchor="middle">IF/ID</text><text class="dh" x="28" y="150" text-anchor="start">DATOS</text><rect class="box" x="24" y="158" width="272" height="22" rx="5"/><text class="mo" x="34" y="173" text-anchor="start">pc</text><rect class="box" x="24" y="184" width="272" height="22" rx="5"/><text class="mo" x="34" y="199" text-anchor="start">pc_plus4</text><rect class="box" x="24" y="210" width="272" height="22" rx="5"/><text class="mo" x="34" y="225" text-anchor="start">instr</text><text class="dh" x="28" y="250" text-anchor="start">CONTROL</text><rect class="box" x="24" y="258" width="272" height="22" rx="5"/><text class="mo" x="34" y="273" text-anchor="start">(todavía ninguno)</text><text class="dh" x="28" y="298" text-anchor="start">DEPURACIÓN</text><rect class="box" x="24" y="306" width="272" height="22" rx="5"/><text class="mo" x="34" y="321" text-anchor="start">valid</text><rect class="sID" x="314" y="96" width="272" height="38" rx="10"/><text class="t" x="450.0" y="121" text-anchor="middle">ID/EX</text><text class="dh" x="318" y="150" text-anchor="start">DATOS</text><rect class="box" x="314" y="158" width="272" height="22" rx="5"/><text class="mo" x="324" y="173" text-anchor="start">pc</text><rect class="box" x="314" y="184" width="272" height="22" rx="5"/><text class="mo" x="324" y="199" text-anchor="start">pc_plus4</text><rect class="box" x="314" y="210" width="272" height="22" rx="5"/><text class="mo" x="324" y="225" text-anchor="start">rs1_data</text><rect class="box" x="314" y="236" width="272" height="22" rx="5"/><text class="mo" x="324" y="251" text-anchor="start">rs2_data</text><rect class="box" x="314" y="262" width="272" height="22" rx="5"/><text class="mo" x="324" y="277" text-anchor="start">imm</text><rect class="box" x="314" y="288" width="272" height="22" rx="5"/><text class="mo" x="324" y="303" text-anchor="start">rs1</text><rect class="box" x="314" y="314" width="272" height="22" rx="5"/><text class="mo" x="324" y="329" text-anchor="start">rs2</text><rect class="box" x="314" y="340" width="272" height="22" rx="5"/><text class="mo" x="324" y="355" text-anchor="start">rd</text><rect class="box" x="314" y="366" width="272" height="22" rx="5"/><text class="mo" x="324" y="381" text-anchor="start">funct3</text><rect class="box" x="314" y="392" width="272" height="22" rx="5"/><text class="mo" x="324" y="407" text-anchor="start">funct7_b5</text><text class="dh" x="318" y="432" text-anchor="start">CONTROL</text><rect class="box" x="314" y="440" width="272" height="22" rx="5"/><text class="mo" x="324" y="455" text-anchor="start">reg_write</text><rect class="box" x="314" y="466" width="272" height="22" rx="5"/><text class="mo" x="324" y="481" text-anchor="start">mem_read</text><rect class="box" x="314" y="492" width="272" height="22" rx="5"/><text class="mo" x="324" y="507" text-anchor="start">mem_write</text><rect class="box" x="314" y="518" width="272" height="22" rx="5"/><text class="mo" x="324" y="533" text-anchor="start">result_src</text><rect class="box" x="314" y="544" width="272" height="22" rx="5"/><text class="mo" x="324" y="559" text-anchor="start">alu_src</text><rect class="box" x="314" y="570" width="272" height="22" rx="5"/><text class="mo" x="324" y="585" text-anchor="start">alu_op</text><rect class="box" x="314" y="596" width="272" height="22" rx="5"/><text class="mo" x="324" y="611" text-anchor="start">branch</text><rect class="box" x="314" y="622" width="272" height="22" rx="5"/><text class="mo" x="324" y="637" text-anchor="start">jump</text><rect class="box" x="314" y="648" width="272" height="22" rx="5"/><text class="mo" x="324" y="663" text-anchor="start">jalr</text><text class="dh" x="318" y="688" text-anchor="start">DEPURACIÓN</text><rect class="box" x="314" y="696" width="272" height="22" rx="5"/><text class="mo" x="324" y="711" text-anchor="start">valid</text><rect class="box" x="314" y="722" width="272" height="22" rx="5"/><text class="mo" x="324" y="737" text-anchor="start">halt</text><rect class="box" x="314" y="748" width="272" height="22" rx="5"/><text class="mo" x="324" y="763" text-anchor="start">instr</text><rect class="sEX" x="604" y="96" width="272" height="38" rx="10"/><text class="t" x="740.0" y="121" text-anchor="middle">EX/MEM</text><text class="dh" x="608" y="150" text-anchor="start">DATOS</text><rect class="box" x="604" y="158" width="272" height="22" rx="5"/><text class="mo" x="614" y="173" text-anchor="start">alu_result</text><rect class="box" x="604" y="184" width="272" height="22" rx="5"/><text class="mo" x="614" y="199" text-anchor="start">store_data</text><rect class="box" x="604" y="210" width="272" height="22" rx="5"/><text class="mo" x="614" y="225" text-anchor="start">rd</text><rect class="box" x="604" y="236" width="272" height="22" rx="5"/><text class="mo" x="614" y="251" text-anchor="start">pc_plus4</text><rect class="box" x="604" y="262" width="272" height="22" rx="5"/><text class="mo" x="614" y="277" text-anchor="start">funct3</text><text class="dh" x="608" y="302" text-anchor="start">CONTROL</text><rect class="box" x="604" y="310" width="272" height="22" rx="5"/><text class="mo" x="614" y="325" text-anchor="start">reg_write</text><rect class="box" x="604" y="336" width="272" height="22" rx="5"/><text class="mo" x="614" y="351" text-anchor="start">mem_read</text><rect class="box" x="604" y="362" width="272" height="22" rx="5"/><text class="mo" x="614" y="377" text-anchor="start">mem_write</text><rect class="box" x="604" y="388" width="272" height="22" rx="5"/><text class="mo" x="614" y="403" text-anchor="start">result_src</text><text class="dh" x="608" y="428" text-anchor="start">DEPURACIÓN</text><rect class="box" x="604" y="436" width="272" height="22" rx="5"/><text class="mo" x="614" y="451" text-anchor="start">valid</text><rect class="box" x="604" y="462" width="272" height="22" rx="5"/><text class="mo" x="614" y="477" text-anchor="start">halt</text><rect class="box" x="604" y="488" width="272" height="22" rx="5"/><text class="mo" x="614" y="503" text-anchor="start">instr</text><rect class="sMEM" x="894" y="96" width="272" height="38" rx="10"/><text class="t" x="1030.0" y="121" text-anchor="middle">MEM/WB</text><text class="dh" x="898" y="150" text-anchor="start">DATOS</text><rect class="box" x="894" y="158" width="272" height="22" rx="5"/><text class="mo" x="904" y="173" text-anchor="start">alu_result</text><rect class="box" x="894" y="184" width="272" height="22" rx="5"/><text class="mo" x="904" y="199" text-anchor="start">mem_data</text><rect class="box" x="894" y="210" width="272" height="22" rx="5"/><text class="mo" x="904" y="225" text-anchor="start">pc_plus4</text><rect class="box" x="894" y="236" width="272" height="22" rx="5"/><text class="mo" x="904" y="251" text-anchor="start">rd</text><text class="dh" x="898" y="276" text-anchor="start">CONTROL</text><rect class="box" x="894" y="284" width="272" height="22" rx="5"/><text class="mo" x="904" y="299" text-anchor="start">reg_write</text><rect class="box" x="894" y="310" width="272" height="22" rx="5"/><text class="mo" x="904" y="325" text-anchor="start">result_src</text><text class="dh" x="898" y="350" text-anchor="start">DEPURACIÓN</text><rect class="box" x="894" y="358" width="272" height="22" rx="5"/><text class="mo" x="904" y="373" text-anchor="start">valid</text><rect class="box" x="894" y="384" width="272" height="22" rx="5"/><text class="mo" x="904" y="399" text-anchor="start">halt</text><rect class="box" x="894" y="410" width="272" height="22" rx="5"/><text class="mo" x="904" y="425" text-anchor="start">instr</text><rect class="dec" x="24" y="800" width="560" height="152" rx="10"/><text class="dh" x="38" y="822" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="42" cy="838" r="2.6" class="mk"/><text class="tn" x="52" y="842" text-anchor="start">El control se calcula en ID y viaja con la instrucción hasta la etapa que lo usa.</text><circle cx="42" cy="858" r="2.6" class="mk"/><text class="tn" x="52" y="862" text-anchor="start">valid distingue burbuja de instrucción real; una burbuja nunca escribe registros ni</text><text class="tn" x="52" y="878" text-anchor="start">memoria.</text><circle cx="42" cy="894" r="2.6" class="mk"/><text class="tn" x="52" y="898" text-anchor="start">halt marca la instrucción ebreak para detener el procesador al llegar a WB.</text><circle cx="42" cy="914" r="2.6" class="mk"/><text class="tn" x="52" y="918" text-anchor="start">rs1 y rs2 viajan en ID/EX para que el forwarding compare contra rd de las etapas</text><text class="tn" x="52" y="934" text-anchor="start">siguientes.</text><rect class="dec" x="612" y="800" width="564" height="136" rx="10"/><text class="dh" x="626" y="822" text-anchor="start">PARA EL VOLCADO (DEBUG UNIT)</text><circle cx="630" cy="838" r="2.6" class="mk"/><text class="tn" x="640" y="842" text-anchor="start">Son flip-flops, no latches reales; no hay que inferir latches.</text><circle cx="630" cy="858" r="2.6" class="mk"/><text class="tn" x="640" y="862" text-anchor="start">El orden de serialización se escribe una sola vez en un documento y se implementa</text><text class="tn" x="640" y="878" text-anchor="start">igual en Verilog y en Python.</text><circle cx="630" cy="894" r="2.6" class="mk"/><text class="tn" x="640" y="898" text-anchor="start">Se vuelcan en bytes enteros, con un orden fijo por campo.</text><circle cx="630" cy="914" r="2.6" class="mk"/><text class="tn" x="640" y="918" text-anchor="start">La PC los muestra en la vista del pipeline.</text></svg>