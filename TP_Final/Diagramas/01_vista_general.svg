<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-label="01 · Vista general del TP final. Flujo de comandos y estado entre la PC y el procesador a través de la UART y la Debug Unit."><title>01 · Vista general del TP final</title><desc>Flujo de comandos y estado entre la PC y el procesador a través de la UART y la Debug Unit.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="730"/><text class="h1" x="24" y="40">01 · Vista general del TP final</text><text class="h2" x="24" y="64">PC ↔ UART ↔ Debug Unit ↔ procesador RISC-V, sobre la Basys 3</text><rect class="zone" x="330" y="96" width="846" height="360" rx="18"/><text class="m" x="346" y="120" text-anchor="start">FPGA Basys 3 (un solo reloj, el enable decide quién avanza)</text><rect class="box" x="24" y="150" width="250" height="250" rx="10"/><text class="t" x="149.0" y="239.0" text-anchor="middle">PC (Python)</text><text class="tn" x="149.0" y="255.0" text-anchor="middle"></text><text class="tn" x="149.0" y="271.0" text-anchor="middle">Ensamblador: asm → palabras</text><text class="tn" x="149.0" y="287.0" text-anchor="middle">Codec del protocolo</text><text class="tn" x="149.0" y="303.0" text-anchor="middle">Golden model</text><text class="tn" x="149.0" y="319.0" text-anchor="middle">CLI / interfaz</text><rect class="tag3" x="34" y="166" width="50" height="18" rx="9"/><text class="lw" x="59" y="179" text-anchor="middle">nuevo</text><rect class="old" x="360" y="150" width="150" height="52" rx="10"/><text class="t" x="435.0" y="172.0" text-anchor="middle">uart_rx</text><text class="tn" x="435.0" y="188.0" text-anchor="middle">recibe bytes</text><rect class="tag2" x="366" y="134" width="36" height="18" rx="9"/><text class="lw" x="384" y="147" text-anchor="middle">TP2</text><rect class="old" x="360" y="214" width="150" height="52" rx="10"/><text class="t" x="435.0" y="236.0" text-anchor="middle">uart_tx</text><text class="tn" x="435.0" y="252.0" text-anchor="middle">manda bytes</text><rect class="tag2" x="366" y="274" width="36" height="18" rx="9"/><text class="lw" x="384" y="287" text-anchor="middle">TP2</text><rect class="old" x="360" y="326" width="150" height="52" rx="10"/><text class="t" x="435.0" y="348.0" text-anchor="middle">baudio_generator</text><text class="tn" x="435.0" y="364.0" text-anchor="middle">tick 16× por bit</text><rect class="tag2" x="366" y="386" width="36" height="18" rx="9"/><text class="lw" x="384" y="399" text-anchor="middle">TP2</text><rect class="new" x="620" y="150" width="190" height="228" rx="10"/><text class="t" x="715.0" y="212.0" text-anchor="middle">Debug Unit (FSM)</text><text class="tn" x="715.0" y="228.0" text-anchor="middle"></text><text class="tn" x="715.0" y="244.0" text-anchor="middle">IDLE · L_COUNT · L_WORD</text><text class="tn" x="715.0" y="260.0" text-anchor="middle">RUN · STEP · DUMP</text><text class="tn" x="715.0" y="276.0" text-anchor="middle"></text><text class="tn" x="715.0" y="292.0" text-anchor="middle">genera enable</text><text class="tn" x="715.0" y="308.0" text-anchor="middle">carga IMEM</text><text class="tn" x="715.0" y="324.0" text-anchor="middle">arma el volcado</text><rect class="tag3" x="626" y="134" width="50" height="18" rx="9"/><text class="lw" x="651" y="147" text-anchor="middle">nuevo</text><rect class="new" x="870" y="150" width="290" height="290" rx="14"/><text class="t" x="1015" y="174" text-anchor="middle">Procesador RISC-V 5 etapas</text><rect class="tag3" x="880" y="184" width="50" height="18" rx="9"/><text class="lw" x="905" y="197" text-anchor="middle">nuevo</text><rect class="box" x="890" y="214" width="120" height="40" rx="10"/><text class="t" x="950.0" y="238.0" text-anchor="middle">IMEM (BRAM)</text><rect class="box" x="1020" y="214" width="120" height="40" rx="10"/><text class="t" x="1080.0" y="238.0" text-anchor="middle">DMEM (BRAM)</text><rect class="box" x="890" y="266" width="250" height="36" rx="10"/><text class="t" x="1015.0" y="288.0" text-anchor="middle">IF → ID → EX → MEM → WB</text><rect class="box" x="890" y="314" width="120" height="40" rx="10"/><text class="t" x="950.0" y="330.0" text-anchor="middle">Banco regs</text><text class="tn" x="950.0" y="346.0" text-anchor="middle">x0..x31</text><rect class="old" x="1020" y="314" width="120" height="40" rx="10"/><text class="t" x="1080.0" y="338.0" text-anchor="middle">ALU 32 bits</text><rect class="tag1" x="1030" y="358" width="36" height="18" rx="9"/><text class="lw" x="1048" y="371" text-anchor="middle">TP1</text><rect class="box" x="890" y="384" width="250" height="40" rx="10"/><text class="t" x="1015.0" y="408.0" text-anchor="middle">Forwarding · stall · flush</text><path class="ar" d="M274,176 L360,176" marker-end="url(#a)"/><text class="lbl" x="317.0" y="168.0" text-anchor="middle">bytes</text><path class="ar" d="M360,240 L274,240" marker-end="url(#a)"/><text class="lbl" x="317.0" y="232.0" text-anchor="middle">bytes</text><path class="ar" d="M510,176 L620,176" marker-end="url(#a)"/><text class="lbl" x="565.0" y="168.0" text-anchor="middle">rx_done, dout</text><path class="ar" d="M620,240 L510,240" marker-end="url(#a)"/><text class="lbl" x="565.0" y="232.0" text-anchor="middle">tx_start, din</text><path class="ar" d="M445,326 L445,266" marker-end="url(#a)"/><path class="ar" d="M445,326 L445,202" marker-end="url(#a)"/><path class="arA" d="M810,200 L870,200" marker-end="url(#aA)"/><text class="lbl" x="840.0" y="192.0" text-anchor="middle">enable</text><path class="arA" d="M810,260 L870,260" marker-end="url(#aA)"/><text class="lbl" x="840.0" y="252.0" text-anchor="middle">carga</text><path class="ar" d="M870,340 L810,340" marker-end="url(#a)"/><text class="lbl" x="840.0" y="332.0" text-anchor="middle">estado</text><text class="m" x="24" y="424" text-anchor="start">Cable USB = UART 9600 baudios, 8N1</text><text class="mo" x="24" y="442" text-anchor="start">Comandos: L cargar · R correr</text><text class="mo" x="24" y="458" text-anchor="start">S un paso · D volcar</text><rect class="dec" x="24" y="480" width="570" height="136" rx="10"/><text class="dh" x="38" y="502" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="42" cy="518" r="2.6" class="mk"/><text class="tn" x="52" y="522" text-anchor="start">El reloj nunca se toca: el procesador avanza solo si enable = 1 (se evita el clock</text><text class="tn" x="52" y="538" text-anchor="start">gating).</text><circle cx="42" cy="554" r="2.6" class="mk"/><text class="tn" x="52" y="558" text-anchor="start">HALT = ebreak (0x00100073), acordado con el profe.</text><circle cx="42" cy="574" r="2.6" class="mk"/><text class="tn" x="52" y="578" text-anchor="start">La UART del TP2 se reusa sin tocar su lógica: baudio_generator, uart_rx, uart_tx.</text><circle cx="42" cy="594" r="2.6" class="mk"/><text class="tn" x="52" y="598" text-anchor="start">La Debug Unit es el patrón de interface_alu (TP2) ampliado a más estados.</text><rect class="dec" x="612" y="480" width="564" height="120" rx="10"/><text class="dh" x="626" y="502" text-anchor="start">FLUJO DEL TP (DE PUNTA A PUNTA)</text><circle cx="630" cy="518" r="2.6" class="mk"/><text class="tn" x="640" y="522" text-anchor="start">1. La PC ensambla el programa y lo manda por UART (L, N, 4N bytes).</text><circle cx="630" cy="538" r="2.6" class="mk"/><text class="tn" x="640" y="542" text-anchor="start">2. La Debug Unit lo guarda en la IMEM, limpia el procesador y responde ACK.</text><circle cx="630" cy="558" r="2.6" class="mk"/><text class="tn" x="640" y="562" text-anchor="start">3. R corre hasta ebreak; S avanza un ciclo. Después se manda el volcado (D).</text><circle cx="630" cy="578" r="2.6" class="mk"/><text class="tn" x="640" y="582" text-anchor="start">4. La PC compara contra el golden model y muestra pipeline, registros y memoria.</text><g transform="translate(24,676)"><rect class="old" width="14" height="14" rx="3"/><text class="m" x="22" y="12">viene de TP1 / TP2</text><rect class="new" x="170" width="14" height="14" rx="3"/><text class="m" x="192" y="12">nuevo en el TP final</text></g></svg>