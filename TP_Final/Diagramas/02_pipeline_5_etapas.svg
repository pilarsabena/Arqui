<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-label="02 · Pipeline de 5 etapas. Cinco etapas IF ID EX MEM WB separadas por cuatro registros de segmentación, con forwarding y redirección de salto."><title>02 · Pipeline de 5 etapas</title><desc>Cinco etapas IF ID EX MEM WB separadas por cuatro registros de segmentación, con forwarding y redirección de salto.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="880"/><text class="h1" x="24" y="40">02 · Pipeline de 5 etapas</text><text class="h2" x="24" y="64">Bloques por etapa, registros de segmentación y caminos de riesgo</text><rect class="sIF" x="24" y="100" width="196" height="420" rx="14" style="fill-opacity:.35"/><text class="t" x="122" y="126" text-anchor="middle">IF · Buscar</text><rect class="sID" x="260" y="100" width="196" height="420" rx="14" style="fill-opacity:.35"/><text class="t" x="358" y="126" text-anchor="middle">ID · Decodificar</text><rect class="sEX" x="496" y="100" width="196" height="420" rx="14" style="fill-opacity:.35"/><text class="t" x="594" y="126" text-anchor="middle">EX · Calcular</text><rect class="sMEM" x="732" y="100" width="196" height="420" rx="14" style="fill-opacity:.35"/><text class="t" x="830" y="126" text-anchor="middle">MEM · Memoria</text><rect class="sWB" x="968" y="100" width="196" height="420" rx="14" style="fill-opacity:.35"/><text class="t" x="1066" y="126" text-anchor="middle">WB · Escribir</text><rect class="lat" x="228" y="100" width="24" height="420" rx="6"/><text class="lw" transform="translate(244,310) rotate(-90)" text-anchor="middle">IF/ID</text><rect class="lat" x="464" y="100" width="24" height="420" rx="6"/><text class="lw" transform="translate(480,310) rotate(-90)" text-anchor="middle">ID/EX</text><rect class="lat" x="700" y="100" width="24" height="420" rx="6"/><text class="lw" transform="translate(716,310) rotate(-90)" text-anchor="middle">EX/MEM</text><rect class="lat" x="936" y="100" width="24" height="420" rx="6"/><text class="lw" transform="translate(952,310) rotate(-90)" text-anchor="middle">MEM/WB</text><rect class="box" x="40" y="150" width="164" height="44" rx="10"/><text class="t" x="122.0" y="176.0" text-anchor="middle">PC</text><rect class="box" x="40" y="214" width="164" height="44" rx="10"/><text class="t" x="122.0" y="232.0" text-anchor="middle">IMEM (BRAM)</text><text class="tn" x="122.0" y="248.0" text-anchor="middle">lectura sincrónica</text><rect class="box" x="40" y="278" width="164" height="44" rx="10"/><text class="t" x="122.0" y="304.0" text-anchor="middle">PC + 4 / mux de salto</text><rect class="box" x="276" y="150" width="164" height="44" rx="10"/><text class="t" x="358.0" y="176.0" text-anchor="middle">Unidad de control</text><rect class="box" x="276" y="214" width="164" height="58" rx="10"/><text class="t" x="358.0" y="239.0" text-anchor="middle">Banco de registros</text><text class="tn" x="358.0" y="255.0" text-anchor="middle">bypass interno</text><rect class="box" x="276" y="292" width="164" height="40" rx="10"/><text class="t" x="358.0" y="316.0" text-anchor="middle">Generador de inmediatos</text><rect class="box" x="276" y="352" width="164" height="44" rx="10"/><text class="t" x="358.0" y="370.0" text-anchor="middle">Detector de riesgos</text><text class="tn" x="358.0" y="386.0" text-anchor="middle">(load-use)</text><rect class="old" x="512" y="150" width="164" height="58" rx="10"/><text class="t" x="594.0" y="175.0" text-anchor="middle">ALU 32 bits</text><text class="tn" x="594.0" y="191.0" text-anchor="middle">+ alu_control</text><rect class="tag1" x="518" y="212" width="36" height="18" rx="9"/><text class="lw" x="536" y="225" text-anchor="middle">TP1</text><rect class="box" x="512" y="246" width="128" height="40" rx="10"/><text class="t" x="576.0" y="262.0" text-anchor="middle">Comparador</text><text class="tn" x="576.0" y="278.0" text-anchor="middle">de salto</text><rect class="fwd" x="512" y="380" width="164" height="44" rx="10"/><text class="t" x="594.0" y="398.0" text-anchor="middle">Muxes de forwarding</text><text class="tn" x="594.0" y="414.0" text-anchor="middle">entradas A y B</text><path class="arF" d="M660,380 L660,210" marker-end="url(#aF)"/><text class="lbl" x="646.0" y="295.0" text-anchor="middle">A, B</text><rect class="box" x="748" y="214" width="164" height="58" rx="10"/><text class="t" x="830.0" y="239.0" text-anchor="middle">DMEM (BRAM)</text><text class="tn" x="830.0" y="255.0" text-anchor="middle">byte enable</text><rect class="box" x="984" y="214" width="164" height="58" rx="10"/><text class="t" x="1066.0" y="239.0" text-anchor="middle">Mux result_src</text><text class="tn" x="1066.0" y="255.0" text-anchor="middle">ALU / dato / PC+4</text><path class="arF" d="M712,520 L712,560 L616,560 L616,426" marker-end="url(#aF)"/><text class="lbl" x="622" y="552" text-anchor="start">desde EX/MEM</text><path class="arF" d="M948,520 L948,590 L556,590 L556,426" marker-end="url(#aF)"/><text class="lbl" x="816" y="606" text-anchor="start">forwarding desde MEM/WB</text><path class="arR" d="M512,266 L502,266 L502,500 L122,500 L122,322" marker-end="url(#aR)"/><text class="lbl" x="134" y="492" text-anchor="start">salto tomado: redirige el PC y descarta 2 instrucciones</text><path class="arA" d="M1066,272 L1066,466 L452,466 L452,243 L440,243" marker-end="url(#aA)"/><text class="lbl" x="742" y="458" text-anchor="start">WB escribe el registro destino</text><rect class="dec" x="24" y="640" width="216" height="128" rx="10"/><text class="dh" x="38" y="662" text-anchor="start">DECISIÓN IF</text><circle cx="42" cy="678" r="2.6" class="mk"/><text class="tn" x="52" y="682" text-anchor="start">BRAM: el dato llega 1 ciclo</text><text class="tn" x="52" y="698" text-anchor="start">después de pedir la</text><text class="tn" x="52" y="714" text-anchor="start">dirección.</text><circle cx="42" cy="730" r="2.6" class="mk"/><text class="tn" x="52" y="734" text-anchor="start">El PC y el puerto de lectura</text><text class="tn" x="52" y="750" text-anchor="start">respetan enable.</text><rect class="dec" x="260" y="640" width="216" height="148" rx="10"/><text class="dh" x="274" y="662" text-anchor="start">DECISIÓN ID</text><circle cx="278" cy="678" r="2.6" class="mk"/><text class="tn" x="288" y="682" text-anchor="start">Control calculado en ID y</text><text class="tn" x="288" y="698" text-anchor="start">viaja con la instrucción.</text><circle cx="278" cy="714" r="2.6" class="mk"/><text class="tn" x="288" y="718" text-anchor="start">Load-use: stall de 1 ciclo y</text><text class="tn" x="288" y="734" text-anchor="start">burbuja.</text><circle cx="278" cy="750" r="2.6" class="mk"/><text class="tn" x="288" y="754" text-anchor="start">Bypass interno: WB escribe,</text><text class="tn" x="288" y="770" text-anchor="start">ID lee el valor nuevo.</text><rect class="dec" x="496" y="640" width="216" height="128" rx="10"/><text class="dh" x="510" y="662" text-anchor="start">DECISIÓN EX</text><circle cx="514" cy="678" r="2.6" class="mk"/><text class="tn" x="524" y="682" text-anchor="start">Branch y jalr se resuelven</text><text class="tn" x="524" y="698" text-anchor="start">acá; salto tomado = 2</text><text class="tn" x="524" y="714" text-anchor="start">descartes.</text><circle cx="514" cy="730" r="2.6" class="mk"/><text class="tn" x="524" y="734" text-anchor="start">Solo se calcula la bandera</text><text class="tn" x="524" y="750" text-anchor="start">zero.</text><rect class="dec" x="732" y="640" width="216" height="112" rx="10"/><text class="dh" x="746" y="662" text-anchor="start">DECISIÓN MEM</text><circle cx="750" cy="678" r="2.6" class="mk"/><text class="tn" x="760" y="682" text-anchor="start">Little-endian; accesos de</text><text class="tn" x="760" y="698" text-anchor="start">byte y media palabra.</text><circle cx="750" cy="714" r="2.6" class="mk"/><text class="tn" x="760" y="718" text-anchor="start">Lectura de la DMEM también</text><text class="tn" x="760" y="734" text-anchor="start">con enable.</text><rect class="dec" x="968" y="640" width="196" height="128" rx="10"/><text class="dh" x="982" y="662" text-anchor="start">DECISIÓN WB</text><circle cx="986" cy="678" r="2.6" class="mk"/><text class="tn" x="996" y="682" text-anchor="start">Un burbuja nunca escribe</text><text class="tn" x="996" y="698" text-anchor="start">(valid = 0).</text><circle cx="986" cy="714" r="2.6" class="mk"/><text class="tn" x="996" y="718" text-anchor="start">ebreak en WB: el</text><text class="tn" x="996" y="734" text-anchor="start">procesador se congela con</text><text class="tn" x="996" y="750" text-anchor="start">el pipeline vacío.</text></svg>