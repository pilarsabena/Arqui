<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="05 · La ALU (de tu TP1 al TP final). ALU de 32 bits con control en dos niveles alu_op y alu_control y salida zero."><title>05 · La ALU (de tu TP1 al TP final)</title><desc>ALU de 32 bits con control en dos niveles alu_op y alu_control y salida zero.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="760"/><text class="h1" x="24" y="40">05 · La ALU (de tu TP1 al TP final)</text><text class="h2" x="24" y="64">De 8 bits parametrizable a 32 bits con 3 operaciones nuevas</text><rect class="box" x="24" y="110" width="170" height="50" rx="10"/><text class="t" x="109.0" y="131.0" text-anchor="middle">Unidad de control</text><text class="tn" x="109.0" y="147.0" text-anchor="middle">mira el opcode</text><rect class="new" x="250" y="110" width="190" height="50" rx="10"/><text class="t" x="345.0" y="131.0" text-anchor="middle">alu_control</text><text class="tn" x="345.0" y="147.0" text-anchor="middle">alu_op + funct3 + funct7</text><path class="ar" d="M194,135 L250,135" marker-end="url(#a)"/><text class="lbl" x="222.0" y="127.0" text-anchor="middle">alu_op (2 bits)</text><rect class="box" x="24" y="240" width="150" height="40" rx="10"/><text class="t" x="99.0" y="264.0" text-anchor="middle">rs1_data</text><rect class="box" x="24" y="320" width="150" height="40" rx="10"/><text class="t" x="99.0" y="344.0" text-anchor="middle">rs2_data</text><rect class="box" x="24" y="400" width="150" height="40" rx="10"/><text class="t" x="99.0" y="424.0" text-anchor="middle">inmediato</text><rect class="box" x="230" y="320" width="100" height="70" rx="10"/><text class="t" x="280.0" y="351.0" text-anchor="middle">mux</text><text class="tn" x="280.0" y="367.0" text-anchor="middle">alu_src</text><path class="ar" d="M174,260 L450,260" marker-end="url(#a)"/><path class="ar" d="M174,340 L230,340" marker-end="url(#a)"/><path class="ar" d="M174,420 L200,420 L200,372 L230,372" marker-end="url(#a)"/><polygon points="450,230 600,270 600,410 450,450" class="old"/><text class="t" x="525" y="330" text-anchor="middle">ALU</text><text class="tn" x="525" y="350" text-anchor="middle">32 bits</text><rect class="tag1" x="488" y="364" width="36" height="18" rx="9"/><text class="lw" x="506" y="377" text-anchor="middle">TP1</text><path class="ar" d="M330,355 L450,355" marker-end="url(#a)"/><text class="lbl" x="390.0" y="347.0" text-anchor="middle">B</text><text class="lbl" x="440" y="254" text-anchor="end">A</text><path class="arA" d="M345,160 L345,200 L525,200 L525,244" marker-end="url(#aA)"/><text class="lbl" x="435.0" y="192.0" text-anchor="middle">alu_ctrl (4 bits)</text><path class="ar" d="M600,340 L680,340" marker-end="url(#a)"/><text class="lbl" x="640.0" y="332.0" text-anchor="middle">resultado</text><path class="ar" d="M600,380 L640,380 L640,440 L680,440" marker-end="url(#a)"/><text class="lbl" x="640.0" y="402.0" text-anchor="middle">zero</text><rect class="box" x="680" y="310" width="130" height="60" rx="10"/><text class="t" x="745.0" y="336.0" text-anchor="middle">alu_result</text><text class="tn" x="745.0" y="352.0" text-anchor="middle">→ EX/MEM</text><rect class="box" x="680" y="415" width="130" height="50" rx="10"/><text class="t" x="745.0" y="436.0" text-anchor="middle">zero</text><text class="tn" x="745.0" y="452.0" text-anchor="middle">→ beq / bne</text><text class="t" x="24" y="500" text-anchor="start">Operaciones del TP final</text><rect class="old" x="24" y="512" width="62" height="32" rx="10"/><text class="mo" x="55.0" y="532.0" text-anchor="middle">ADD</text><rect class="old" x="94" y="512" width="62" height="32" rx="10"/><text class="mo" x="125.0" y="532.0" text-anchor="middle">SUB</text><rect class="old" x="164" y="512" width="62" height="32" rx="10"/><text class="mo" x="195.0" y="532.0" text-anchor="middle">AND</text><rect class="old" x="234" y="512" width="62" height="32" rx="10"/><text class="mo" x="265.0" y="532.0" text-anchor="middle">OR</text><rect class="old" x="304" y="512" width="62" height="32" rx="10"/><text class="mo" x="335.0" y="532.0" text-anchor="middle">XOR</text><rect class="new" x="374" y="512" width="62" height="32" rx="10"/><text class="mo" x="405.0" y="532.0" text-anchor="middle">SLL</text><rect class="old" x="444" y="512" width="62" height="32" rx="10"/><text class="mo" x="475.0" y="532.0" text-anchor="middle">SRL</text><rect class="old" x="514" y="512" width="62" height="32" rx="10"/><text class="mo" x="545.0" y="532.0" text-anchor="middle">SRA</text><rect class="new" x="584" y="512" width="62" height="32" rx="10"/><text class="mo" x="615.0" y="532.0" text-anchor="middle">SLT</text><rect class="new" x="654" y="512" width="62" height="32" rx="10"/><text class="mo" x="685.0" y="532.0" text-anchor="middle">SLTU</text><text class="m" x="24" y="566" text-anchor="start">En verde: operaciones agregadas respecto de tu TP1 (SLL, SLT, SLTU). NOR queda de sobra.</text><text class="t" x="850" y="130" text-anchor="start">alu_op</text><text class="mo" x="850" y="152" text-anchor="start">00  sumar (loads, stores, jalr)</text><text class="mo" x="850" y="170" text-anchor="start">01  restar (beq, bne)</text><text class="mo" x="850" y="188" text-anchor="start">10  R-type: mirar funct3 y funct7</text><text class="mo" x="850" y="206" text-anchor="start">11  I aritmético: mirar funct3</text><rect class="box" x="850" y="240" width="326" height="200" rx="10"/><text class="t" x="1013.0" y="296.0" text-anchor="middle">Qué cambia respecto del TP1</text><text class="tn" x="1013.0" y="312.0" text-anchor="middle"></text><text class="tn" x="1013.0" y="328.0" text-anchor="middle">Ancho: parametrizable (8 en TP2) → 32 bits</text><text class="tn" x="1013.0" y="344.0" text-anchor="middle">Banderas: zero, carry, overflow → solo zero</text><text class="tn" x="1013.0" y="360.0" text-anchor="middle">Desplazar: shift de b según a → rs1 según rs2</text><text class="tn" x="1013.0" y="376.0" text-anchor="middle">Código de op: 6 bits de la cátedra → 4 bits</text><text class="tn" x="1013.0" y="392.0" text-anchor="middle">NOR sobra; se agregan SLL, SLT, SLTU</text><rect class="dec" x="24" y="600" width="1152" height="136" rx="10"/><text class="dh" x="38" y="622" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="42" cy="638" r="2.6" class="mk"/><text class="tn" x="52" y="642" text-anchor="start">Reusar la ALU del TP1 (ya es parametrizable con DATA_WIDTH): se instancia con 32 y se agregan 3 operaciones, en vez de reescribirla.</text><circle cx="42" cy="658" r="2.6" class="mk"/><text class="tn" x="52" y="662" text-anchor="start">Control en dos niveles: la unidad de control solo dice la familia (alu_op) y alu_control afina con funct3 y funct7; así cambiar una instrucción no toca la ALU.</text><circle cx="42" cy="678" r="2.6" class="mk"/><text class="tn" x="52" y="682" text-anchor="start">Trampa del bit 30: en R-type distingue add de sub, pero en I-type es parte del inmediato. Solo se mira si funct3 = 101 (srli/srai); si no, addi x1,x0,-1024 se ejecutaría</text><text class="tn" x="52" y="698" text-anchor="start">como sub.</text><circle cx="42" cy="714" r="2.6" class="mk"/><text class="tn" x="52" y="718" text-anchor="start">Los desplazamientos toman la cantidad de rs2 (o shamt): hay que invertir los operandos respecto de cómo desplazaba tu TP1.</text></svg>