<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="06 · La UART (tu TP2). Generador de tick de baudios, receptor y transmisor, trama 8N1 y señales de handshake."><title>06 · La UART (tu TP2)</title><desc>Generador de tick de baudios, receptor y transmisor, trama 8N1 y señales de handshake.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="820"/><text class="h1" x="24" y="40">06 · La UART (tu TP2)</text><text class="h2" x="24" y="64">baudio_generator → uart_rx / uart_tx, y cómo viaja un byte</text><rect class="old" x="24" y="110" width="200" height="70" rx="10"/><text class="t" x="124.0" y="141.0" text-anchor="middle">baudio_generator</text><text class="tn" x="124.0" y="157.0" text-anchor="middle">contador módulo M</text><rect class="tag2" x="30" y="94" width="36" height="18" rx="9"/><text class="lw" x="48" y="107" text-anchor="middle">TP2</text><rect class="box" x="300" y="110" width="170" height="70" rx="10"/><text class="t" x="385.0" y="141.0" text-anchor="middle">s_tick</text><text class="tn" x="385.0" y="157.0" text-anchor="middle">16 pulsos por bit</text><path class="ar" d="M224,145 L300,145" marker-end="url(#a)"/><text class="mo" x="24" y="206" text-anchor="start">M = round( f_clk / (16 × baud) )</text><text class="mo" x="24" y="224" text-anchor="start">100 MHz, 9600 baud → M = 651</text><rect class="old" x="540" y="100" width="300" height="130" rx="10"/><text class="t" x="690.0" y="145.0" text-anchor="middle">uart_rx (FSMD)</text><text class="tn" x="690.0" y="161.0" text-anchor="middle">idle → start → data (8 bits) → stop</text><text class="tn" x="690.0" y="177.0" text-anchor="middle">sincronizador de 2 flip-flops</text><text class="tn" x="690.0" y="193.0" text-anchor="middle">registra en el medio del bit (tick 8/16)</text><rect class="tag2" x="546" y="84" width="36" height="18" rx="9"/><text class="lw" x="564" y="97" text-anchor="middle">TP2</text><rect class="old" x="540" y="270" width="300" height="130" rx="10"/><text class="t" x="690.0" y="315.0" text-anchor="middle">uart_tx (FSMD)</text><text class="tn" x="690.0" y="331.0" text-anchor="middle">idle → start → data (8 bits) → stop</text><text class="tn" x="690.0" y="347.0" text-anchor="middle">envía un bit cada 16 ticks</text><text class="tn" x="690.0" y="363.0" text-anchor="middle">tx_done_tick al terminar</text><rect class="tag2" x="546" y="254" width="36" height="18" rx="9"/><text class="lw" x="564" y="267" text-anchor="middle">TP2</text><path class="ar" d="M470,145 L540,145" marker-end="url(#a)"/><path class="ar" d="M400,180 L400,320 L540,320" marker-end="url(#a)"/><text class="mo" x="24" y="300" text-anchor="start">rx (pin)</text><rect class="box" x="24" y="262" width="130" height="40" rx="10"/><text class="t" x="89.0" y="286.0" text-anchor="middle">pin rx (PC → FPGA)</text><path class="ar" d="M154,282 L480,282 L480,200 L540,200" marker-end="url(#a)"/><rect class="box" x="24" y="330" width="130" height="40" rx="10"/><text class="t" x="89.0" y="354.0" text-anchor="middle">pin tx (FPGA → PC)</text><path class="ar" d="M540,350 L154,350" marker-end="url(#a)"/><rect class="box" x="900" y="100" width="276" height="130" rx="10"/><text class="t" x="1038.0" y="153.0" text-anchor="middle">Interfaz hacia la Debug Unit</text><text class="mo" x="1038.0" y="169.0" text-anchor="middle">rx_done_tick  (pulso 1 ciclo)</text><text class="mo" x="1038.0" y="185.0" text-anchor="middle">dout[7:0]  (byte recibido)</text><rect class="box" x="900" y="270" width="276" height="130" rx="10"/><text class="t" x="1038.0" y="315.0" text-anchor="middle">Interfaz desde la Debug Unit</text><text class="mo" x="1038.0" y="331.0" text-anchor="middle">tx_start  (pulso: &quot;mandá&quot;)</text><text class="mo" x="1038.0" y="347.0" text-anchor="middle">din[7:0]  (byte a enviar)</text><text class="mo" x="1038.0" y="363.0" text-anchor="middle">tx_done_tick  (terminé)</text><path class="arA" d="M840,165 L900,165" marker-end="url(#aA)"/><path class="arA" d="M900,335 L840,335" marker-end="url(#aA)"/><text class="t" x="24" y="440" text-anchor="start">Trama 8N1: 1 bit de start, 8 bits de datos (el bajo primero), sin paridad, 1 bit de stop</text><text class="mo" x="24" y="525" text-anchor="start">línea</text><text class="m" x="24" y="560" text-anchor="start">ej: 0xA5</text><text class="m" x="170.0" y="578" text-anchor="middle">start</text><text class="mo" x="170.0" y="596" text-anchor="middle">0</text><text class="m" x="250.0" y="578" text-anchor="middle">b0</text><text class="mo" x="250.0" y="596" text-anchor="middle">1</text><text class="m" x="330.0" y="578" text-anchor="middle">b1</text><text class="mo" x="330.0" y="596" text-anchor="middle">0</text><text class="m" x="410.0" y="578" text-anchor="middle">b2</text><text class="mo" x="410.0" y="596" text-anchor="middle">1</text><text class="m" x="490.0" y="578" text-anchor="middle">b3</text><text class="mo" x="490.0" y="596" text-anchor="middle">0</text><text class="m" x="570.0" y="578" text-anchor="middle">b4</text><text class="mo" x="570.0" y="596" text-anchor="middle">0</text><text class="m" x="650.0" y="578" text-anchor="middle">b5</text><text class="mo" x="650.0" y="596" text-anchor="middle">1</text><text class="m" x="730.0" y="578" text-anchor="middle">b6</text><text class="mo" x="730.0" y="596" text-anchor="middle">0</text><text class="m" x="810.0" y="578" text-anchor="middle">b7</text><text class="mo" x="810.0" y="596" text-anchor="middle">1</text><text class="m" x="890.0" y="578" text-anchor="middle">stop</text><text class="mo" x="890.0" y="596" text-anchor="middle">1</text><path class="arA" d="M70,490 L130,490 L130,540 L210,540 L210,490 L290,490 L290,540 L370,540 L370,490 L450,490 L450,540 L530,540 L530,540 L610,540 L610,490 L690,490 L690,540 L770,540 L770,490 L850,490 L850,490 L930,490 L930,490 L970,490" style="stroke-linejoin:round"/><line x1="130" y1="480" x2="130" y2="550" class="zone" style="stroke-width:1"/><line x1="210" y1="480" x2="210" y2="550" class="zone" style="stroke-width:1"/><line x1="290" y1="480" x2="290" y2="550" class="zone" style="stroke-width:1"/><line x1="370" y1="480" x2="370" y2="550" class="zone" style="stroke-width:1"/><line x1="450" y1="480" x2="450" y2="550" class="zone" style="stroke-width:1"/><line x1="530" y1="480" x2="530" y2="550" class="zone" style="stroke-width:1"/><line x1="610" y1="480" x2="610" y2="550" class="zone" style="stroke-width:1"/><line x1="690" y1="480" x2="690" y2="550" class="zone" style="stroke-width:1"/><line x1="770" y1="480" x2="770" y2="550" class="zone" style="stroke-width:1"/><line x1="850" y1="480" x2="850" y2="550" class="zone" style="stroke-width:1"/><line x1="930" y1="480" x2="930" y2="550" class="zone" style="stroke-width:1"/><rect class="dec" x="24" y="630" width="570" height="136" rx="10"/><text class="dh" x="38" y="652" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="42" cy="668" r="2.6" class="mk"/><text class="tn" x="52" y="672" text-anchor="start">Se reusan baudio_generator, uart_rx y uart_tx del TP2 sin tocar su lógica.</text><circle cx="42" cy="688" r="2.6" class="mk"/><text class="tn" x="52" y="692" text-anchor="start">Sobremuestreo ×16: se lee cada bit en el centro, lejos de los bordes ruidosos.</text><circle cx="42" cy="708" r="2.6" class="mk"/><text class="tn" x="52" y="712" text-anchor="start">Handshake start/done: la Debug Unit no manda un byte hasta ver tx_done_tick, así no se</text><text class="tn" x="52" y="728" text-anchor="start">pierde ninguno.</text><circle cx="42" cy="744" r="2.6" class="mk"/><text class="tn" x="52" y="748" text-anchor="start">Sincronizador de 2 flip-flops en rx: evita metaestabilidad con una señal asíncrona.</text><rect class="dec" x="612" y="630" width="564" height="132" rx="10"/><text class="dh" x="626" y="652" text-anchor="start">QUÉ CAMBIA EN EL TP FINAL</text><circle cx="630" cy="668" r="2.6" class="mk"/><text class="tn" x="640" y="672" text-anchor="start">Se mantiene 9600 baud, 8N1 (el plan del compañero usaba 19200 con paridad: es otro</text><text class="tn" x="640" y="688" text-anchor="start">TP2).</text><circle cx="630" cy="704" r="2.6" class="mk"/><text class="tn" x="640" y="708" text-anchor="start">Si el Clock Wizard cambia la frecuencia, hay que recalcular M con CLK_FREQ del top.</text><circle cx="630" cy="724" r="2.6" class="mk"/><text class="tn" x="640" y="728" text-anchor="start">A 9600 baud un volcado grande tarda del orden de medio segundo: decidir si se sube la</text><text class="tn" x="640" y="744" text-anchor="start">velocidad.</text></svg>