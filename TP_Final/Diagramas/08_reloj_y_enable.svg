<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="08 · El reloj y el enable. Comparación entre clock gating prohibido y clock enable permitido, con forma de onda."><title>08 · El reloj y el enable</title><desc>Comparación entre clock gating prohibido y clock enable permitido, con forma de onda.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="720"/><text class="h1" x="24" y="40">08 · El reloj y el enable</text><text class="h2" x="24" y="64">Cómo ejecutar &quot;un ciclo por comando&quot; sin tocar el clock</text><text class="t" x="24" y="106" text-anchor="start">✗  Clock gating (prohibido)</text><text class="t" x="612" y="106" text-anchor="start">✓  Clock enable (lo que hacemos)</text><rect class="box" x="24" y="120" width="150" height="50" rx="10"/><text class="t" x="99.0" y="149.0" text-anchor="middle">clk</text><rect class="fls" x="230" y="120" width="90" height="50" rx="10"/><text class="t" x="275.0" y="149.0" text-anchor="middle">AND</text><rect class="box" x="380" y="110" width="150" height="70" rx="10"/><text class="t" x="455.0" y="141.0" text-anchor="middle">flip-flops</text><text class="tn" x="455.0" y="157.0" text-anchor="middle">del procesador</text><path class="ar" d="M174,145 L230,138" marker-end="url(#a)"/><rect class="box" x="24" y="190" width="150" height="40" rx="10"/><text class="t" x="99.0" y="214.0" text-anchor="middle">enable</text><path class="ar" d="M174,210 L200,210 L200,152 L230,152" marker-end="url(#a)"/><path class="arR" d="M320,145 L380,145" marker-end="url(#aR)"/><text class="lbl" x="350.0" y="137.0" text-anchor="middle">clk filtrado</text><text class="tn" x="24" y="260" text-anchor="start">Riesgos: skew entre ramas del reloj, pulsos falsos (glitches),</text><text class="tn" x="24" y="276" text-anchor="start">el reloj deja de ser uno solo y el timing se complica.</text><rect class="box" x="612" y="120" width="150" height="50" rx="10"/><text class="t" x="687.0" y="149.0" text-anchor="middle">clk</text><path class="arA" d="M762,145 L840,145" marker-end="url(#aA)"/><text class="lbl" x="801.0" y="137.0" text-anchor="middle">llega intacto</text><rect class="new" x="840" y="110" width="180" height="70" rx="10"/><text class="t" x="930.0" y="141.0" text-anchor="middle">flip-flops con CE</text><text class="tn" x="930.0" y="157.0" text-anchor="middle">if (enable) q &lt;= d</text><rect class="box" x="612" y="190" width="150" height="40" rx="10"/><text class="t" x="687.0" y="214.0" text-anchor="middle">enable</text><path class="arA" d="M762,210 L930,210 L930,180" marker-end="url(#aA)"/><text class="tn" x="612" y="260" text-anchor="start">El enable es un pin del propio flip-flop: el reloj no se toca,</text><text class="tn" x="612" y="276" text-anchor="start">y todo el diseño sigue sincrónico con un solo clock.</text><path class="ar" d="M170,396 L170,396 L170,366 L205.0,366 L205.0,396 L240,396 L240,366 L275.0,366 L275.0,396 L310,396 L310,366 L345.0,366 L345.0,396 L380,396 L380,366 L415.0,366 L415.0,396 L450,396 L450,366 L485.0,366 L485.0,396 L520,396 L520,366 L555.0,366 L555.0,396 L590,396 L590,366 L625.0,366 L625.0,396 L660,396 L660,366 L695.0,366 L695.0,396 L730,396 L730,366 L765.0,366 L765.0,396 L800,396 L800,366 L835.0,366 L835.0,396 L870,396 L870,366 L905.0,366 L905.0,396 L940,396 L940,366 L975.0,366 L975.0,396 L1010,396"/><text class="mo" x="24" y="382" text-anchor="start">clk</text><text class="m" x="176.0" y="352" text-anchor="start">1</text><text class="m" x="246.0" y="352" text-anchor="start">2</text><text class="m" x="316.0" y="352" text-anchor="start">3</text><text class="m" x="386.0" y="352" text-anchor="start">4</text><text class="m" x="456.0" y="352" text-anchor="start">5</text><text class="m" x="526.0" y="352" text-anchor="start">6</text><text class="m" x="596.0" y="352" text-anchor="start">7</text><text class="m" x="666.0" y="352" text-anchor="start">8</text><text class="m" x="736.0" y="352" text-anchor="start">9</text><text class="m" x="806.0" y="352" text-anchor="start">10</text><text class="m" x="876.0" y="352" text-anchor="start">11</text><text class="m" x="946.0" y="352" text-anchor="start">12</text><text class="mo" x="24" y="452" text-anchor="start">enable</text><path class="arA" d="M170,466 L240,466 L240,466 L310,466 L310,436 L380,436 L380,466 L450,466 L450,466 L520,466 L520,466 L590,466 L590,436 L660,436 L660,436 L730,436 L730,436 L800,436 L800,466 L870,466 L870,466 L940,466 L940,466 L1010,466"/><text class="mo" x="24" y="522" text-anchor="start">pc</text><path class="ar" d="M170,506 L240,506 L240,506 L310,506 L310,506 L380,506 L380,506 L450,506 L450,506 L520,506 L520,506 L590,506 L590,506 L660,506 L660,506 L730,506 L730,506 L800,506 L800,506 L870,506 L870,506 L940,506 L940,506 L1010,506"/><text class="mo" x="310.0" y="526" text-anchor="middle">PC=0</text><text class="mo" x="520.0" y="526" text-anchor="middle">PC=4</text><text class="mo" x="695.0" y="526" text-anchor="middle">PC=8</text><text class="mo" x="765.0" y="526" text-anchor="middle">PC=12</text><text class="mo" x="905.0" y="526" text-anchor="middle">PC=16</text><line class="arA" x1="380" y1="490" x2="380" y2="536" style="stroke-width:1.5"/><line class="arA" x1="660" y1="490" x2="660" y2="536" style="stroke-width:1.5"/><line class="arA" x1="730" y1="490" x2="730" y2="536" style="stroke-width:1.5"/><line class="arA" x1="800" y1="490" x2="800" y2="536" style="stroke-width:1.5"/><text class="m" x="170" y="566" text-anchor="start">El PC solo cambia en los flancos donde enable = 1 (ciclos 3, 7, 8 y 9): STEP = un pulso de un ciclo; RUN = enable sostenido.</text><rect class="dec" x="24" y="600" width="1152" height="100" rx="10"/><text class="dh" x="38" y="622" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="42" cy="638" r="2.6" class="mk"/><text class="tn" x="52" y="642" text-anchor="start">El enunciado pide ejecutar de a un ciclo y a la vez no intervenir el clock: la única forma limpia es el clock enable (ADR-001).</text><circle cx="42" cy="658" r="2.6" class="mk"/><text class="tn" x="52" y="662" text-anchor="start">Todo registro del núcleo (PC, registros de segmentación, banco de registros, memorias) respeta el mismo enable.</text><circle cx="42" cy="678" r="2.6" class="mk"/><text class="tn" x="52" y="682" text-anchor="start">La Debug Unit genera el enable; es el único módulo que decide cuándo avanza el procesador.</text></svg>