<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="07 · Debug Unit (máquina de estados). Estados IDLE L_COUNT L_WORD RUN STEP DUMP con transiciones y la señal enable."><title>07 · Debug Unit (máquina de estados)</title><desc>Estados IDLE L_COUNT L_WORD RUN STEP DUMP con transiciones y la señal enable.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="740"/><text class="h1" x="24" y="40">07 · Debug Unit (máquina de estados)</text><text class="h2" x="24" y="64">Es tu interface_alu del TP2, ampliada</text><path class="ar" d="M435,270 L235,270" marker-end="url(#a)"/><text class="lbl" x="335.0" y="262.0" text-anchor="middle">L (0x4C)</text><path class="ar" d="M170,295 L170,395" marker-end="url(#a)"/><text class="lbl" x="130.0" y="349.0" text-anchor="middle">llega N</text><path class="arA" d="M235,430 L400,430 L400,285 L435,285" marker-end="url(#aA)"/><text class="lbl" x="400.0" y="349.5" text-anchor="middle">4N bytes → ACK</text><path class="ar" d="M565,250 L700,250 L700,140 L835,140" marker-end="url(#a)"/><text class="lbl" x="767.5" y="132.0" text-anchor="middle">R (0x52)</text><path class="ar" d="M565,270 L835,270" marker-end="url(#a)"/><text class="lbl" x="700.0" y="262.0" text-anchor="middle">S (0x53)</text><path class="ar" d="M565,290 L700,290 L700,420 L835,420" marker-end="url(#a)"/><text class="lbl" x="767.5" y="412.0" text-anchor="middle">D (0x44)</text><path class="ar" d="M900,295 L900,395" marker-end="url(#a)"/><text class="lbl" x="854.0" y="349.0" text-anchor="middle">pasó 1 ciclo</text><path class="ar" d="M965,140 L1090,140 L1090,420 L965,420" marker-end="url(#a)"/><text class="lbl" x="1098" y="296" text-anchor="start">ebreak</text><text class="lbl" x="1098" y="312" text-anchor="start">llega a WB</text><path class="arA" d="M835,440 L500,440 L500,295" marker-end="url(#aA)"/><text class="lbl" x="667.5" y="458.0" text-anchor="middle">terminó de enviar</text><rect class="box" x="435.0" y="245.0" width="130" height="50" rx="10"/><text class="t" x="500.0" y="274.0" text-anchor="middle">IDLE</text><rect class="new" x="835.0" y="115.0" width="130" height="50" rx="10"/><text class="t" x="900.0" y="144.0" text-anchor="middle">RUN</text><rect class="new" x="835.0" y="245.0" width="130" height="50" rx="10"/><text class="t" x="900.0" y="274.0" text-anchor="middle">STEP</text><rect class="box" x="835.0" y="395.0" width="130" height="50" rx="10"/><text class="t" x="900.0" y="424.0" text-anchor="middle">DUMP</text><rect class="box" x="105.0" y="245.0" width="130" height="50" rx="10"/><text class="t" x="170.0" y="274.0" text-anchor="middle">L_COUNT</text><rect class="box" x="105.0" y="395.0" width="130" height="50" rx="10"/><text class="t" x="170.0" y="424.0" text-anchor="middle">L_WORD</text><text class="m" x="500" y="230" text-anchor="middle">(arranque / reset)</text><text class="dh" x="900" y="100" text-anchor="middle">enable = 1 sostenido</text><text class="m" x="978" y="274" text-anchor="start"></text><text class="m" x="900" y="298" text-anchor="start"></text><text class="dh" x="972" y="262" text-anchor="start">enable = 1</text><text class="dh" x="972" y="278" text-anchor="start">un solo ciclo</text><text class="m" x="24" y="520" text-anchor="start">Cualquier otro evento en un estado → NACK y no cambia de estado. Timeout en L_COUNT / L_WORD → vuelve a IDLE y descarta la carga.</text><rect class="box" x="24" y="560" width="520" height="170" rx="10"/><text class="t" x="284.0" y="593.0" text-anchor="middle">De interface_alu a Debug Unit</text><text class="tn" x="284.0" y="609.0" text-anchor="middle"></text><text class="tn" x="284.0" y="625.0" text-anchor="middle">WAIT_A (espero byte) → IDLE (espero comando)</text><text class="tn" x="284.0" y="641.0" text-anchor="middle">WAIT_B / WAIT_OP → L_COUNT / L_WORD</text><text class="tn" x="284.0" y="657.0" text-anchor="middle">SEND + tx_start → ACK o volcado</text><text class="tn" x="284.0" y="673.0" text-anchor="middle">WAIT_TX + tx_done_tick → esperar antes del siguiente byte</text><text class="tn" x="284.0" y="689.0" text-anchor="middle">timeout 0,5 s → carga cortada</text><text class="tn" x="284.0" y="705.0" text-anchor="middle">default: WAIT_A → ante lo imprevisto, IDLE</text><rect class="dec" x="570" y="560" width="606" height="172" rx="10"/><text class="dh" x="584" y="582" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="588" cy="598" r="2.6" class="mk"/><text class="tn" x="598" y="602" text-anchor="start">En STEP el enable dura exactamente un ciclo; si dura dos, el procesador avanza dos.</text><circle cx="588" cy="618" r="2.6" class="mk"/><text class="tn" x="598" y="622" text-anchor="start">Cada palabra se arma con word &lt;= {dout, word[31:8]}: el byte bajo llega primero (little-</text><text class="tn" x="598" y="638" text-anchor="start">endian).</text><circle cx="588" cy="654" r="2.6" class="mk"/><text class="tn" x="598" y="658" text-anchor="start">Cargar limpia pipeline, registros y memoria de datos, y rellena la IMEM con HALT, para que no</text><text class="tn" x="598" y="674" text-anchor="start">se ejecute código viejo.</text><circle cx="588" cy="690" r="2.6" class="mk"/><text class="tn" x="598" y="694" text-anchor="start">Sin HALT el PC daría la vuelta: se mitiga con relleno de HALT y un comando ABORT.</text><circle cx="588" cy="710" r="2.6" class="mk"/><text class="tn" x="598" y="714" text-anchor="start">RUN y STEP deben dar el mismo resultado final; se prueba en la placa.</text></svg>