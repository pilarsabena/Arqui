</defs><rect class="bg" width="1200" height="760"/><text class="h1" x="24" y="40">11 · Plan de trabajo en 3 semanas</text><text class="h2" x="24" y="64">Dos carriles en paralelo: núcleo y Debug Unit + PC; se juntan en la semana 3</text><rect class="sIF" x="24" y="90" width="352" height="34" rx="10"/><text class="t" x="200.0" y="111.0" text-anchor="middle">Semana 1</text><rect class="sIF" x="424" y="90" width="352" height="34" rx="10"/><text class="t" x="600.0" y="111.0" text-anchor="middle">Semana 2</text><rect class="sIF" x="824" y="90" width="352" height="34" rx="10"/><text class="t" x="1000.0" y="111.0" text-anchor="middle">Semana 3</text><text class="dh" x="24" y="160" text-anchor="start">NÚCLEO</text><text class="dh" x="24" y="350" text-anchor="start">DEBUG UNIT + PC</text><text class="dh" x="24" y="540" text-anchor="start">ENTRE LAS DOS</text><rect class="box" x="24" y="170" width="352" height="150" rx="10"/><text class="t" x="200.0" y="209.0" text-anchor="middle">Diagrama y contrato</text><text class="tn" x="200.0" y="225.0" text-anchor="middle"></text><text class="tn" x="200.0" y="241.0" text-anchor="middle">Tabla de control, interfaz del núcleo</text><text class="tn" x="200.0" y="257.0" text-anchor="middle">ALU, banco de registros, control,</text><text class="tn" x="200.0" y="273.0" text-anchor="middle">inmediatos, memorias</text><text class="tn" x="200.0" y="289.0" text-anchor="middle">Etapas IF a WB sin riesgos (sim.)</text><rect class="box" x="424" y="170" width="352" height="150" rx="10"/><text class="t" x="600.0" y="217.0" text-anchor="middle">Integración y HALT</text><text class="tn" x="600.0" y="233.0" text-anchor="middle"></text><text class="tn" x="600.0" y="249.0" text-anchor="middle">Forwarding, load-use y flush</text><text class="tn" x="600.0" y="265.0" text-anchor="middle">con sus testbenches</text><text class="tn" x="600.0" y="281.0" text-anchor="middle">Programas de prueba por riesgo</text><rect class="new" x="824" y="170" width="352" height="150" rx="10"/><text class="t" x="1000.0" y="225.0" text-anchor="middle">Núcleo real en la placa</text><text class="tn" x="1000.0" y="241.0" text-anchor="middle"></text><text class="tn" x="1000.0" y="257.0" text-anchor="middle">Ajustar timing: camino crítico,</text><text class="tn" x="1000.0" y="273.0" text-anchor="middle">skew, frecuencia (Clock Wizard)</text><rect class="box" x="24" y="360" width="352" height="150" rx="10"/><text class="t" x="200.0" y="407.0" text-anchor="middle">Protocolo mínimo escrito</text><text class="tn" x="200.0" y="423.0" text-anchor="middle"></text><text class="tn" x="200.0" y="439.0" text-anchor="middle">Ensamblador chico en Python</text><text class="tn" x="200.0" y="455.0" text-anchor="middle">Debug Unit con núcleo falso:</text><text class="tn" x="200.0" y="471.0" text-anchor="middle">carga, RUN y STEP en simulación</text><rect class="box" x="424" y="360" width="352" height="150" rx="10"/><text class="t" x="600.0" y="407.0" text-anchor="middle">Volcado completo</text><text class="tn" x="600.0" y="423.0" text-anchor="middle"></text><text class="tn" x="600.0" y="439.0" text-anchor="middle">CLI mínima</text><text class="tn" x="600.0" y="455.0" text-anchor="middle">Debug Unit probada en la placa</text><text class="tn" x="600.0" y="471.0" text-anchor="middle">con núcleo falso</text><rect class="new" x="824" y="360" width="352" height="150" rx="10"/><text class="t" x="1000.0" y="415.0" text-anchor="middle">Interfaz de PC y comparación</text><text class="tn" x="1000.0" y="431.0" text-anchor="middle"></text><text class="tn" x="1000.0" y="447.0" text-anchor="middle">golden model vs placa</text><text class="tn" x="1000.0" y="463.0" text-anchor="middle">Vista del pipeline</text><rect class="dec" x="24" y="550" width="352" height="110" rx="10"/><text class="t" x="200.0" y="601.0" text-anchor="middle">Acordar el protocolo y el orden</text><text class="tn" x="200.0" y="617.0" text-anchor="middle">de campos del volcado (una vez)</text><rect class="dec" x="424" y="550" width="352" height="110" rx="10"/><text class="t" x="600.0" y="601.0" text-anchor="middle">Contrato estable entre núcleo y</text><text class="tn" x="600.0" y="617.0" text-anchor="middle">Debug Unit: puertos y enable</text><rect class="new" x="824" y="550" width="352" height="110" rx="10"/><text class="t" x="1000.0" y="593.0" text-anchor="middle">Suite de programas en la placa</text><text class="tn" x="1000.0" y="609.0" text-anchor="middle">Reportes de timing, informe,</text><text class="tn" x="1000.0" y="625.0" text-anchor="middle">ensayo de la defensa</text><path class="ar" d="M376,245 L424,245" marker-end="url(#a)"/><path class="ar" d="M376,435 L424,435" marker-end="url(#a)"/><path class="ar" d="M776,245 L824,245" marker-end="url(#a)"/><path class="ar" d="M776,435 L824,435" marker-end="url(#a)"/><rect class="dec" x="24" y="680" width="1152" height="60" rx="10"/><text class="dh" x="38" y="702" text-anchor="start">DECISIONES DE DISEÑO (CÓMO SE CORTA EL TRABAJO)</text><circle cx="42" cy="718" r="2.6" class="mk"/><text class="tn" x="52" y="722" text-anchor="start">Dos carriles independientes gracias a un núcleo falso para la Debug Unit y a un golden model para el núcleo.</text></svg>