<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="11 · Plan de trabajo en 3 semanas. Plan de tres semanas con hitos del núcleo y de la Debug Unit y software de PC."><title>11 · Plan de trabajo en 3 semanas</title><desc>Plan de tres semanas con hitos del núcleo y de la Debug Unit y software de PC.</desc><style>
