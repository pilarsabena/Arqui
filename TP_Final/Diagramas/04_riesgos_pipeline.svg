<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="04 · Riesgos del pipeline. Tres diagramas de ocupación: forwarding evita esperas, load-use obliga a un stall, y un salto tomado descarta dos instrucciones."><title>04 · Riesgos del pipeline</title><desc>Tres diagramas de ocupación: forwarding evita esperas, load-use obliga a un stall, y un salto tomado descarta dos instrucciones.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="900"/><text class="h1" x="24" y="40">04 · Riesgos del pipeline</text><text class="h2" x="24" y="64">Forwarding, load-use y salto tomado, ciclo por ciclo</text><text class="t" x="24" y="100" text-anchor="start">A · Forwarding: add → sub sin esperar</text><text class="m" x="262.0" y="126" text-anchor="middle">1</text><text class="m" x="324.0" y="126" text-anchor="middle">2</text><text class="m" x="386.0" y="126" text-anchor="middle">3</text><text class="m" x="448.0" y="126" text-anchor="middle">4</text><text class="m" x="510.0" y="126" text-anchor="middle">5</text><text class="m" x="572.0" y="126" text-anchor="middle">6</text><text class="m" x="634.0" y="126" text-anchor="middle">7</text><text class="m" x="696.0" y="126" text-anchor="middle">8</text><text class="mo" x="24" y="153" text-anchor="start">add x3,x1,x2</text><rect class="sIF" x="236" y="134" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="265.0" y="153" text-anchor="middle">IF</text><rect class="sID" x="298" y="134" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="327.0" y="153" text-anchor="middle">ID</text><rect class="sEX" x="360" y="134" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="389.0" y="153" text-anchor="middle">EX</text><rect class="sMEM" x="422" y="134" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="451.0" y="153" text-anchor="middle">MEM</text><rect class="sWB" x="484" y="134" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="513.0" y="153" text-anchor="middle">WB</text><text class="mo" x="24" y="189" text-anchor="start">sub x4,x3,x1</text><rect class="sIF" x="298" y="170" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="327.0" y="189" text-anchor="middle">IF</text><rect class="sID" x="360" y="170" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="389.0" y="189" text-anchor="middle">ID</text><rect class="sEX" x="422" y="170" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="451.0" y="189" text-anchor="middle">EX</text><rect class="sMEM" x="484" y="170" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="513.0" y="189" text-anchor="middle">MEM</text><rect class="sWB" x="546" y="170" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="575.0" y="189" text-anchor="middle">WB</text><path class="arF" d="M395.0,164 L445.0,170" marker-end="url(#aF)"/><text class="lbl" x="560" y="152" text-anchor="start">x3 viaja de EX/MEM a EX</text><rect class="dec" x="790" y="96" width="386" height="132" rx="10"/><text class="dh" x="804" y="118" text-anchor="start">CÓMO SE RESUELVE</text><circle cx="808" cy="134" r="2.6" class="mk"/><text class="tn" x="818" y="138" text-anchor="start">El resultado del add existe al final de EX y se reenvía</text><text class="tn" x="818" y="154" text-anchor="start">desde EX/MEM.</text><circle cx="808" cy="170" r="2.6" class="mk"/><text class="tn" x="818" y="174" text-anchor="start">El sub lo usa en su EX, un ciclo después: cero esperas.</text><circle cx="808" cy="190" r="2.6" class="mk"/><text class="tn" x="818" y="194" text-anchor="start">Sin forwarding, el sub tendría que esperar a que el add</text><text class="tn" x="818" y="210" text-anchor="start">escriba en WB.</text><text class="t" x="24" y="290" text-anchor="start">B · Load-use: un stall inevitable</text><text class="m" x="262.0" y="316" text-anchor="middle">1</text><text class="m" x="324.0" y="316" text-anchor="middle">2</text><text class="m" x="386.0" y="316" text-anchor="middle">3</text><text class="m" x="448.0" y="316" text-anchor="middle">4</text><text class="m" x="510.0" y="316" text-anchor="middle">5</text><text class="m" x="572.0" y="316" text-anchor="middle">6</text><text class="m" x="634.0" y="316" text-anchor="middle">7</text><text class="m" x="696.0" y="316" text-anchor="middle">8</text><text class="mo" x="24" y="343" text-anchor="start">lw  x1,0(x2)</text><rect class="sIF" x="236" y="324" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="265.0" y="343" text-anchor="middle">IF</text><rect class="sID" x="298" y="324" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="327.0" y="343" text-anchor="middle">ID</text><rect class="sEX" x="360" y="324" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="389.0" y="343" text-anchor="middle">EX</text><rect class="sMEM" x="422" y="324" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="451.0" y="343" text-anchor="middle">MEM</text><rect class="sWB" x="484" y="324" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="513.0" y="343" text-anchor="middle">WB</text><text class="mo" x="24" y="379" text-anchor="start">add x3,x1,x1</text><rect class="sIF" x="298" y="360" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="327.0" y="379" text-anchor="middle">IF</text><rect class="sID" x="360" y="360" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="389.0" y="379" text-anchor="middle">ID</text><rect class="stl" x="422" y="360" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="451.0" y="379" text-anchor="middle">ID</text><rect class="sEX" x="484" y="360" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="513.0" y="379" text-anchor="middle">EX</text><rect class="sMEM" x="546" y="360" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="575.0" y="379" text-anchor="middle">MEM</text><rect class="sWB" x="608" y="360" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="637.0" y="379" text-anchor="middle">WB</text><text class="mo" x="24" y="415" text-anchor="start">sub x5,x6,x7</text><rect class="sIF" x="360" y="396" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="389.0" y="415" text-anchor="middle">IF</text><rect class="stl" x="422" y="396" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="451.0" y="415" text-anchor="middle">IF</text><rect class="sID" x="484" y="396" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="513.0" y="415" text-anchor="middle">ID</text><rect class="sEX" x="546" y="396" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="575.0" y="415" text-anchor="middle">EX</text><rect class="sMEM" x="608" y="396" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="637.0" y="415" text-anchor="middle">MEM</text><rect class="sWB" x="670" y="396" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="699.0" y="415" text-anchor="middle">WB</text><path class="arF" d="M457.0,354 L507.0,360" marker-end="url(#aF)"/><text class="lbl" x="560" y="342" text-anchor="start">x1 viaja de MEM a EX (tras 1 stall)</text><rect class="dec" x="790" y="286" width="386" height="132" rx="10"/><text class="dh" x="804" y="308" text-anchor="start">CÓMO SE RESUELVE</text><circle cx="808" cy="324" r="2.6" class="mk"/><text class="tn" x="818" y="328" text-anchor="start">El dato del lw recién existe al final de MEM: ni el</text><text class="tn" x="818" y="344" text-anchor="start">forwarding llega a tiempo.</text><circle cx="808" cy="360" r="2.6" class="mk"/><text class="tn" x="818" y="364" text-anchor="start">El detector en ID congela el PC y IF/ID un ciclo y mete</text><text class="tn" x="818" y="380" text-anchor="start">una burbuja en ID/EX.</text><circle cx="808" cy="396" r="2.6" class="mk"/><text class="tn" x="818" y="400" text-anchor="start">Es el único stall que queda con forwarding completo.</text><text class="t" x="24" y="510" text-anchor="start">C · Salto tomado: flush de 2 instrucciones</text><text class="m" x="262.0" y="536" text-anchor="middle">1</text><text class="m" x="324.0" y="536" text-anchor="middle">2</text><text class="m" x="386.0" y="536" text-anchor="middle">3</text><text class="m" x="448.0" y="536" text-anchor="middle">4</text><text class="m" x="510.0" y="536" text-anchor="middle">5</text><text class="m" x="572.0" y="536" text-anchor="middle">6</text><text class="m" x="634.0" y="536" text-anchor="middle">7</text><text class="m" x="696.0" y="536" text-anchor="middle">8</text><text class="mo" x="24" y="563" text-anchor="start">beq x1,x2,L</text><rect class="sIF" x="236" y="544" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="265.0" y="563" text-anchor="middle">IF</text><rect class="sID" x="298" y="544" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="327.0" y="563" text-anchor="middle">ID</text><rect class="sEX" x="360" y="544" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="389.0" y="563" text-anchor="middle">EX</text><rect class="sMEM" x="422" y="544" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="451.0" y="563" text-anchor="middle">MEM</text><rect class="sWB" x="484" y="544" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="513.0" y="563" text-anchor="middle">WB</text><text class="mo" x="24" y="599" text-anchor="start">instr +4</text><rect class="sIF" x="298" y="580" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="327.0" y="599" text-anchor="middle">IF</text><rect class="fls" x="360" y="580" width="58" height="30" rx="6" /><text class="t" x="389.0" y="599" text-anchor="middle">ID</text><text class="mo" x="24" y="635" text-anchor="start">instr +8</text><rect class="fls" x="360" y="616" width="58" height="30" rx="6" /><text class="t" x="389.0" y="635" text-anchor="middle">IF</text><text class="mo" x="24" y="671" text-anchor="start">destino L</text><rect class="sIF" x="422" y="652" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="451.0" y="671" text-anchor="middle">IF</text><rect class="sID" x="484" y="652" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="513.0" y="671" text-anchor="middle">ID</text><rect class="sEX" x="546" y="652" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="575.0" y="671" text-anchor="middle">EX</text><rect class="sMEM" x="608" y="652" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="637.0" y="671" text-anchor="middle">MEM</text><rect class="sWB" x="670" y="652" width="58" height="30" rx="6" style="fill-opacity:.8"/><text class="t" x="699.0" y="671" text-anchor="middle">WB</text><path class="arF" d="M395.0,574 L445.0,652" marker-end="url(#aF)"/><text class="lbl" x="472.0" y="623.0" text-anchor="middle">nuevo PC</text><rect class="dec" x="790" y="506" width="386" height="168" rx="10"/><text class="dh" x="804" y="528" text-anchor="start">CÓMO SE RESUELVE</text><circle cx="808" cy="544" r="2.6" class="mk"/><text class="tn" x="818" y="548" text-anchor="start">El beq decide en EX: para entonces ya entraron 2</text><text class="tn" x="818" y="564" text-anchor="start">instrucciones del camino equivocado.</text><circle cx="808" cy="580" r="2.6" class="mk"/><text class="tn" x="818" y="584" text-anchor="start">Se descartan (flush) y el PC salta al destino: pérdida de</text><text class="tn" x="818" y="600" text-anchor="start">2 ciclos.</text><circle cx="808" cy="616" r="2.6" class="mk"/><text class="tn" x="818" y="620" text-anchor="start">El flush gana sobre un stall simultáneo.</text><circle cx="808" cy="636" r="2.6" class="mk"/><text class="tn" x="818" y="640" text-anchor="start">Un ebreak buscado detrás de un salto tomado se descarta</text><text class="tn" x="818" y="656" text-anchor="start">igual (HALT especulativo).</text><rect class="dec" x="24" y="730" width="1152" height="100" rx="10"/><text class="dh" x="38" y="752" text-anchor="start">DECISIONES DE DISEÑO (MAPA DE RIESGOS)</text><circle cx="42" cy="768" r="2.6" class="mk"/><text class="tn" x="52" y="772" text-anchor="start">Riesgo de datos: forwarding completo (EX/MEM y MEM/WB hacia EX) + stall solo en load-use + bypass interno en el banco de registros.</text><circle cx="42" cy="788" r="2.6" class="mk"/><text class="tn" x="52" y="792" text-anchor="start">Riesgo de control: branch y jalr en EX; jal puede ir en ID como mejora opcional (pierde 1 ciclo en vez de 2).</text><circle cx="42" cy="808" r="2.6" class="mk"/><text class="tn" x="52" y="812" text-anchor="start">Riesgo estructural: memorias de instrucciones y datos separadas; banco de registros con lectura combinacional y bypass.</text><g transform="translate(24,858)"><rect class="sIF" width="14" height="14" rx="3"/><text class="m" x="22" y="12">avanza normal</text><rect class="stl" x="150" width="14" height="14" rx="3"/><text class="m" x="172" y="12">frenada (stall)</text><rect class="fls" x="300" width="14" height="14" rx="3"/><text class="m" x="322" y="12">descartada (flush)</text><path class="arF" d="M470,7 L520,7"/><text class="m" x="528" y="12">camino del forwarding / redirección</text></g></svg>