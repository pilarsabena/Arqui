<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="10 · Flujo de punta a punta. Diagrama de secuencia entre la PC, la UART con la Debug Unit y el procesador RISC-V: cargar, correr, volcar y comparar."><title>10 · Flujo de punta a punta</title><desc>Diagrama de secuencia entre la PC, la UART con la Debug Unit y el procesador RISC-V: cargar, correr, volcar y comparar.</desc><style>
.bg{fill:#f7f9fc}
.box{fill:#fff;stroke:#9fb0c6;stroke-width:1.6}
.new{fill:#d9f1ef;stroke:#0b7a75;stroke-width:1.8}
.old{fill:#fff4d6;stroke:#c99700;stroke-width:1.8}
.dec{fill:#fff8e1;stroke:#c99700;stroke-width:1.4;stroke-dasharray:5 3}
.zone{fill:none;stroke:#9fb0c6;stroke-width:1.5;stroke-dasharray:8 5}
.sIF{fill:#fbe3a3;stroke:#c9a33a}.sID{fill:#c9ecd0;stroke:#5fa771}.sEX{fill:#c3dcf8;stroke:#5b8fcb}.sMEM{fill:#e2cdf1;stroke:#9a6cc0}.sWB{fill:#f9ccd2;stroke:#cf6a78}
.lat{fill:#14213d;stroke:#14213d}
.stl{fill:#fff4d6;stroke:#c99700}.fls{fill:#fde3e3;stroke:#b4232a}.fwd{fill:#e8e0f6;stroke:#6747aa}
.t{fill:#14213d;font:600 13px system-ui,Segoe UI,sans-serif}
.tn{fill:#14213d;font:400 12px system-ui,Segoe UI,sans-serif}
.m{fill:#4f5d75;font:400 11.5px system-ui,Segoe UI,sans-serif}
.h1{fill:#14213d;font:700 24px system-ui,Segoe UI,sans-serif}
.h2{fill:#4f5d75;font:400 14px system-ui,Segoe UI,sans-serif}
.dh{fill:#7a5a00;font:700 12px system-ui,Segoe UI,sans-serif;letter-spacing:.06em}
.mo{fill:#14213d;font:500 11.5px ui-monospace,Menlo,Consolas,monospace}
.lw{fill:#fff;font:700 12px system-ui,sans-serif}
.ar{fill:none;stroke:#14213d;stroke-width:1.8}
.arA{fill:none;stroke:#0b7a75;stroke-width:2.2}
.arF{fill:none;stroke:#6747aa;stroke-width:2;stroke-dasharray:6 4}
.arR{fill:none;stroke:#b4232a;stroke-width:2;stroke-dasharray:6 4}
.mk{fill:#14213d}.mkA{fill:#0b7a75}.mkF{fill:#6747aa}.mkR{fill:#b4232a}
.lbl{fill:#14213d;font:600 11.5px system-ui,sans-serif;paint-order:stroke;stroke:#f7f9fc;stroke-width:4px;stroke-linejoin:round}
.tag1{fill:#c99700}.tag2{fill:#0b7a75}.tag3{fill:#6747aa}
@media (prefers-color-scheme: dark){
.bg{fill:#0e1620}.box{fill:#162230;stroke:#4a6078}.new{fill:#123b3a;stroke:#46c2bb}.old{fill:#3a2f10;stroke:#e0b43a}
.dec{fill:#2b2410;stroke:#e0b43a}.zone{stroke:#4a6078}
.sIF{fill:#5a4a17;stroke:#c9a33a}.sID{fill:#1f4a2c;stroke:#5fa771}.sEX{fill:#1e3d63;stroke:#5b8fcb}.sMEM{fill:#46285f;stroke:#9a6cc0}.sWB{fill:#5e2630;stroke:#cf6a78}
.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
.ar{stroke:#e2ebef}.arA{stroke:#46c2bb}.arF{stroke:#b7a0f2}.arR{stroke:#ef7f7f}
.mk{fill:#e2ebef}.mkA{fill:#46c2bb}.mkF{fill:#b7a0f2}.mkR{fill:#ef7f7f}
.lbl{fill:#e2ebef;stroke:#0e1620}.tag1{fill:#e0b43a}.tag2{fill:#46c2bb}.tag3{fill:#b7a0f2}}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkA"/></marker>
<marker id="aF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkR"/></marker>
</defs><rect class="bg" width="1200" height="900"/><text class="h1" x="24" y="40">10 · Flujo de punta a punta</text><text class="h2" x="24" y="64">Qué pasa desde que escribís el programa hasta que lo comparás con el golden model</text><rect class="box" x="60" y="90" width="180" height="44" rx="10"/><text class="t" x="150.0" y="116.0" text-anchor="middle">PC (Python)</text><line class="zone" x1="150" y1="134" x2="150" y2="800"/><rect class="new" x="470" y="90" width="180" height="44" rx="10"/><text class="t" x="560.0" y="116.0" text-anchor="middle">UART + Debug Unit</text><line class="zone" x1="560" y1="134" x2="560" y2="800"/><rect class="new" x="900" y="90" width="180" height="44" rx="10"/><text class="t" x="990.0" y="116.0" text-anchor="middle">Procesador</text><line class="zone" x1="990" y1="134" x2="990" y2="800"/><rect class="sIF" x="24" y="150" width="1152" height="22" rx="6" style="fill-opacity:.35"/><text class="dh" x="36" y="166" text-anchor="start">1 · PREPARAR</text><path class="ar" d="M150,182 L190,182 L190,204 L150,204" marker-end="url(#a)"/><text class="tn" x="198" y="198" text-anchor="start">ensambla el .asm → N palabras de 32 bits</text><rect class="sIF" x="24" y="220" width="1152" height="22" rx="6" style="fill-opacity:.35"/><text class="dh" x="36" y="236" text-anchor="start">2 · CARGAR</text><path class="ar" d="M150,262 L560,262" marker-end="url(#a)"/><text class="lbl" x="355.0" y="255.0" text-anchor="middle">L (0x4C)</text><path class="ar" d="M150,290 L560,290" marker-end="url(#a)"/><text class="lbl" x="355.0" y="283.0" text-anchor="middle">N</text><path class="ar" d="M150,318 L560,318" marker-end="url(#a)"/><text class="lbl" x="355.0" y="311.0" text-anchor="middle">4N bytes (byte bajo primero)</text><path class="ar" d="M560,336 L600,336 L600,358 L560,358" marker-end="url(#a)"/><text class="tn" x="608" y="352" text-anchor="start">arma cada palabra y escribe la IMEM</text><path class="arA" d="M560,380 L990,380" marker-end="url(#aA)"/><text class="lbl" x="775.0" y="373.0" text-anchor="middle">limpia pipeline, registros y DMEM</text><path class="arA" d="M560,408 L150,408" marker-end="url(#aA)"/><text class="lbl" x="355.0" y="401.0" text-anchor="middle">ACK</text><rect class="sIF" x="24" y="430" width="1152" height="22" rx="6" style="fill-opacity:.35"/><text class="dh" x="36" y="446" text-anchor="start">3 · EJECUTAR (RUN o STEP)</text><path class="ar" d="M150,472 L560,472" marker-end="url(#a)"/><text class="lbl" x="355.0" y="465.0" text-anchor="middle">R (0x52)  ó  S (0x53)</text><path class="arA" d="M560,500 L990,500" marker-end="url(#aA)"/><text class="lbl" x="775.0" y="493.0" text-anchor="middle">enable = 1 (sostenido / 1 ciclo)</text><path class="ar" d="M990,520 L950,520 L950,542 L990,542" marker-end="url(#a)"/><text class="tn" x="942" y="536" text-anchor="end">corre hasta ebreak en WB (o 1 ciclo)</text><path class="ar" d="M990,570 L560,570" marker-end="url(#a)"/><text class="lbl" x="775.0" y="563.0" text-anchor="middle">ebreak en WB / terminó el paso</text><rect class="sIF" x="24" y="590" width="1152" height="22" rx="6" style="fill-opacity:.35"/><text class="dh" x="36" y="606" text-anchor="start">4 · VOLCAR</text><path class="ar" d="M150,634 L560,634" marker-end="url(#a)"/><text class="lbl" x="355.0" y="627.0" text-anchor="middle">D (0x44)  (en RUN se manda solo)</text><path class="ar" d="M990,662 L560,662" marker-end="url(#a)"/><text class="lbl" x="775.0" y="655.0" text-anchor="middle">registros, registros de segmentación, memoria</text><path class="arA" d="M560,690 L150,690" marker-end="url(#aA)"/><text class="lbl" x="355.0" y="683.0" text-anchor="middle">bytes del volcado</text><rect class="sIF" x="24" y="710" width="1152" height="22" rx="6" style="fill-opacity:.35"/><text class="dh" x="36" y="726" text-anchor="start">5 · COMPARAR</text><path class="ar" d="M150,742 L190,742 L190,764 L150,764" marker-end="url(#a)"/><text class="tn" x="198" y="758" text-anchor="start">compara contra el golden model y muestra el pipeline</text><rect class="dec" x="24" y="790" width="570" height="100" rx="10"/><text class="dh" x="38" y="812" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="42" cy="828" r="2.6" class="mk"/><text class="tn" x="52" y="832" text-anchor="start">RUN y STEP deben dar el mismo resultado final.</text><circle cx="42" cy="848" r="2.6" class="mk"/><text class="tn" x="52" y="852" text-anchor="start">El procesador nunca habla con la PC: solo la Debug Unit.</text><circle cx="42" cy="868" r="2.6" class="mk"/><text class="tn" x="52" y="872" text-anchor="start">Cargar siempre limpia el procesador antes de correr.</text><rect class="dec" x="612" y="790" width="564" height="100" rx="10"/><text class="dh" x="626" y="812" text-anchor="start">PREGUNTAS ABIERTAS</text><circle cx="630" cy="828" r="2.6" class="mk"/><text class="tn" x="640" y="832" text-anchor="start">Tamaño y formato de N.</text><circle cx="630" cy="848" r="2.6" class="mk"/><text class="tn" x="640" y="852" text-anchor="start">Orden del volcado y baudrate.</text><circle cx="630" cy="868" r="2.6" class="mk"/><text class="tn" x="640" y="872" text-anchor="start">Cabecera de 6 bytes: sí o no.</text></svg>