<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="09 · Memorias: LUTRAM vs BRAM. Comparación de temporización entre lectura combinacional y sincrónica y su efecto en el fetch."><title>09 · Memorias: LUTRAM vs BRAM</title><desc>Comparación de temporización entre lectura combinacional y sincrónica y su efecto en el fetch.</desc><style>
