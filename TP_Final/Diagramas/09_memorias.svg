</defs><rect class="bg" width="1200" height="760"/><text class="h1" x="24" y="40">09 · Memorias: LUTRAM vs BRAM</text><text class="h2" x="24" y="64">El dato de una BRAM llega un ciclo después de pedir la dirección</text><text class="t" x="24" y="104" text-anchor="start">LUTRAM: lectura combinacional</text><path class="ar" d="M170,150 L170,150 L170,120 L215.0,120 L215.0,150 L260,150 L260,120 L305.0,120 L305.0,150 L350,150 L350,120 L395.0,120 L395.0,150 L440,150 L440,120 L485.0,120 L485.0,150 L530,150 L530,120 L575.0,120 L575.0,150 L620,150 L620,120 L665.0,120 L665.0,150 L710,150 L710,120 L755.0,120 L755.0,150 L800,150 L800,120 L845.0,120 L845.0,150 L890,150 L890,120 L935.0,120 L935.0,150 L980,150"/><text class="mo" x="24" y="140" text-anchor="start">clk</text><text class="mo" x="24" y="176" text-anchor="start">addr</text><rect class="new" x="173" y="156" width="174" height="30" rx="6"/><text class="mo" x="260.0" y="176" text-anchor="middle">A</text><rect class="new" x="353" y="156" width="174" height="30" rx="6"/><text class="mo" x="440.0" y="176" text-anchor="middle">B</text><rect class="new" x="533" y="156" width="174" height="30" rx="6"/><text class="mo" x="620.0" y="176" text-anchor="middle">C</text><text class="mo" x="24" y="226" text-anchor="start">dato</text><rect class="old" x="173" y="206" width="174" height="30" rx="6"/><text class="mo" x="260.0" y="226" text-anchor="middle">dato A</text><rect class="old" x="353" y="206" width="174" height="30" rx="6"/><text class="mo" x="440.0" y="226" text-anchor="middle">dato B</text><rect class="old" x="533" y="206" width="174" height="30" rx="6"/><text class="mo" x="620.0" y="226" text-anchor="middle">dato C</text><text class="m" x="730" y="222" text-anchor="start">mismo ciclo</text><text class="t" x="24" y="288" text-anchor="start">BRAM: lectura sincrónica</text><path class="ar" d="M170,334 L170,334 L170,304 L215.0,304 L215.0,334 L260,334 L260,304 L305.0,304 L305.0,334 L350,334 L350,304 L395.0,304 L395.0,334 L440,334 L440,304 L485.0,304 L485.0,334 L530,334 L530,304 L575.0,304 L575.0,334 L620,334 L620,304 L665.0,304 L665.0,334 L710,334 L710,304 L755.0,304 L755.0,334 L800,334 L800,304 L845.0,304 L845.0,334 L890,334 L890,304 L935.0,304 L935.0,334 L980,334"/><text class="mo" x="24" y="324" text-anchor="start">clk</text><text class="mo" x="24" y="360" text-anchor="start">addr</text><rect class="new" x="173" y="340" width="174" height="30" rx="6"/><text class="mo" x="260.0" y="360" text-anchor="middle">A</text><rect class="new" x="353" y="340" width="174" height="30" rx="6"/><text class="mo" x="440.0" y="360" text-anchor="middle">B</text><rect class="new" x="533" y="340" width="174" height="30" rx="6"/><text class="mo" x="620.0" y="360" text-anchor="middle">C</text><text class="mo" x="24" y="410" text-anchor="start">dato</text><rect class="old" x="263" y="390" width="174" height="30" rx="6"/><text class="mo" x="350.0" y="410" text-anchor="middle">dato A</text><rect class="old" x="443" y="390" width="174" height="30" rx="6"/><text class="mo" x="530.0" y="410" text-anchor="middle">dato B</text><rect class="old" x="623" y="390" width="174" height="30" rx="6"/><text class="mo" x="710.0" y="410" text-anchor="middle">dato C</text><text class="lbl" x="820" y="406" text-anchor="start">1 ciclo después</text><rect class="box" x="24" y="470" width="360" height="130" rx="10"/><text class="t" x="204.0" y="507.0" text-anchor="middle">En el procesador (fetch)</text><text class="tn" x="204.0" y="523.0" text-anchor="middle"></text><text class="tn" x="204.0" y="539.0" text-anchor="middle">PC pide la dirección en el ciclo N;</text><text class="tn" x="204.0" y="555.0" text-anchor="middle">la instrucción aparece en el ciclo N+1.</text><text class="tn" x="204.0" y="571.0" text-anchor="middle">Hay que alinear PC e instrucción para IF/ID.</text><rect class="box" x="410" y="470" width="360" height="130" rx="10"/><text class="t" x="590.0" y="507.0" text-anchor="middle">Con enable (STEP)</text><text class="tn" x="590.0" y="523.0" text-anchor="middle"></text><text class="tn" x="590.0" y="539.0" text-anchor="middle">Si el puerto de lectura no respeta enable,</text><text class="tn" x="590.0" y="555.0" text-anchor="middle">la instrucción de IF/ID cambiaría sola</text><text class="tn" x="590.0" y="571.0" text-anchor="middle">durante un paso. Se frena con enable.</text><rect class="box" x="796" y="470" width="380" height="130" rx="10"/><text class="t" x="986.0" y="507.0" text-anchor="middle">Tamaños del TP</text><text class="tn" x="986.0" y="523.0" text-anchor="middle"></text><text class="tn" x="986.0" y="539.0" text-anchor="middle">IMEM y DMEM: 256 palabras (1 KiB) cada una</text><text class="tn" x="986.0" y="555.0" text-anchor="middle">BRAM inferida, dual port</text><text class="tn" x="986.0" y="571.0" text-anchor="middle">BRAM sin reset: se rellena al cargar</text><rect class="dec" x="24" y="630" width="1152" height="120" rx="10"/><text class="dh" x="38" y="652" text-anchor="start">DECISIONES DE DISEÑO</text><circle cx="42" cy="668" r="2.6" class="mk"/><text class="tn" x="52" y="672" text-anchor="start">BRAM inferida (no LUTRAM): no gasta LUTs y alcanza para 1 KiB; el costo es la lectura sincrónica de un ciclo.</text><circle cx="42" cy="688" r="2.6" class="mk"/><text class="tn" x="52" y="692" text-anchor="start">Dual port: el núcleo y la Debug Unit acceden a la vez (cargar programa mientras el núcleo está parado).</text><circle cx="42" cy="708" r="2.6" class="mk"/><text class="tn" x="52" y="712" text-anchor="start">Byte enable para sb/sh sin pisar los otros bytes; little-endian en todo el diseño.</text><circle cx="42" cy="728" r="2.6" class="mk"/><text class="tn" x="52" y="732" text-anchor="start">Memoria de programa rellena con HALT al cargar, para que ninguna instrucción vieja se ejecute.</text></svg>