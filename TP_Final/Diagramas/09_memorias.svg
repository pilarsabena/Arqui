.lat{fill:#e2ebef;stroke:#e2ebef}.stl{fill:#3a2f10;stroke:#e0b43a}.fls{fill:#4a1f22;stroke:#ef7f7f}.fwd{fill:#2b2445;stroke:#b7a0f2}
.t,.tn,.h1,.mo{fill:#e2ebef}.m,.h2{fill:#a3b4c0}.dh{fill:#f1c75a}.lw{fill:#0e1620}
